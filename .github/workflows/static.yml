kground:var(--sand);width:min(900px,100%);max-height:90vh;overflow:auto;display:grid;grid-template-columns:40% 60%;position:relative}.modal-panel>img{width:100%;height:100%;min-height:460px;object-fit:cover}.modal-content{padding:46px}.modal-content h2{font-size:43px;line-height:1.2;margin:12px 0 16px}.modal-content p,.modal-content li{color:var(--muted);font-size:14px;line-height:1.8}.modal-content ul{columns:2;padding-left:19px;margin-bottom:27px}.close{position:absolute;top:12px;right:12px;background:var(--forest);color:white;border:0;font-size:26px;width:38px;height:38px}.wa{position:fixed;right:25px;bottom:25px;z-index:12;border-radius:50px;background:#237b59;color:white;padding:16px 20px;box-shadow:0 5px 22px #0003;font-size:13px;font-weight:700}.wa:hover{background:#15583d}@media(max-width:850px){.navlinks a:not(.outline){display:none}.hero{min-height:650px}.intro{grid-template-columns:1fr;padding-top:70px;padding-bottom:70px;gap:35px}.intro img{height:380px}.cards{grid-template-columns:repeat(2,1fr)}.why-grid{gap:20px}.modal-panel{grid-template-columns:1fr}.modal-panel>img{height:220px;min-height:0}.modal-content{padding:30px}}@media(max-width:580px){.nav{padding:20px 5%}.brand{font-size:18px}.navlinks{gap:0}.outline{padding:10px;font-size:10px}.hero h1{font-size:57px}.cards,.why-grid{grid-template-columns:1fr}.photo{height:280px}.intro img{height:300px}.tours,.why{padding:70px 0}.feature{min-height:530px}.footer{flex-direction:column;text-align:center}.modal-content ul{columns:1}.wa{right:14px;bottom:14px}}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}</style></head><body><header class="nav"><a href="#home" class="brand">THE PARK<span>4YOU</span><small style="display:block;font-size:9px;letter-spacing:.28em;font-weight:400;margin-top:4px">TRAVEL · COSTA RICA</small></a><nav class="navlinks"><a href="#about">Our Story</a><a href="#experiences">Experiences</a><a href="#why">Why Travel With Us</a><a href="#contact" class="outline">Plan Your Adventure ↗</a></nav></header><main><section id="home" class="hero"><div class="container"><div class="eyebrow">Curated adventures · Guanacaste, Costa Rica</div><h1>Beyond the ordinary.<br><i>Into the extraordinary.</i></h1><p>Discover hidden waterfalls, wild landscapes and unforgettable moments. Your Costa Rica adventure begins here.</p><a href="#experiences" class="btn">Explore our experiences <span>↗</span></a></div><div class="hero-bottom">THE PARK4YOU TRAVEL &nbsp; / &nbsp; COSTA RICA</div></section><section id="about" class="intro container"><div><div class="eyebrow">A more personal way to explore</div><h2>Every journey<br>has a story.</h2><p>We are a small, family-run travel company based in Northwest Costa Rica. We believe the best adventures are personal: thoughtful details, welcoming guides and moments you'll remember long after the journey ends.</p><p>From peaceful wildlife encounters to adrenaline-filled adventures, we help you discover the country we love.</p><a class="small" href="#experiences">Discover your next experience →</a></div><img loading="lazy" alt="Tropical Costa Rican coastline" src="https://images.unsplash.com/photo-1518259102261-b40117eabbc1?auto=format&fit=crop&w=1000&q=85"></section><section id="experiences" class="tours"><div class="container"><div class="section-head"><div class="eyebrow">The collection</div><h2 class="section-title">Experiences worth traveling for.</h2><p class="section-lead">From volcanoes and rainforests to Pacific beaches, find the adventure that feels like yours.</p></div><div class="filters" role="group" aria-label="Filter tours"><button class="filter active" data-filter="all">All experiences</button><button class="filter" data-filter="nature">Nature & Wildlife</button><button class="filter" data-filter="adventure">Adventure</button><button class="filter" data-filter="beach">Coastal Escapes</button><button class="filter" data-filter="culture">Culture & Discovery</button></div><div class="cards" id="cards"></div></div></section><section class="feature"><div class="container"><div class="eyebrow" style="color:#ead4b2">More than a destination</div><h2>Find your own<br><i>Pura Vida.</i></h2><p>Slow down on a hidden beach. Follow a trail into the rainforest. Take the scenic route. The most memorable moments are waiting for you.</p><a class="btn" href="https://wa.me/50683016664?text=Hello%20The%20Park4You%2C%20I%27d%20like%20to%20plan%20an%20experience." target="_blank" rel="noopener">Plan your trip ↗</a></div></section><section id="why" class="why container"><div class="eyebrow">Our philosophy</div><h2 class="section-title">Travel feels better together.</h2><div class="why-grid"><div><div class="number">01</div><h3>A personal touch</h3><p>A family-run team that takes time to get to know you and makes every journey feel special.</p></div><div><div class="number">02</div><h3>Nature, up close</h3><p>Discover extraordinary landscapes, wildlife and adventures across Costa Rica.</p></div><div><div class="number">03</div><h3>Every detail matters</h3><p>Thoughtful experiences and helpful guidance, so you can focus on enjoying the journey.</p></div></div></section><section id="contact" class="contact"><div class="eyebrow" style="color:#dfbd8c">Your next chapter begins here</div><h2>Let's make your next trip unforgettable.</h2><p>Tell us what inspires you, and let's find the perfect experience together.</p><a class="btn" href="https://wa.me/50683016664?text=Hello%20The%20Park4You%2C%20I%27d%20like%20to%20book%20a%20tour." target="_blank" rel="noopener">Reserve via WhatsApp ↗</a><p style="font-size:12px;margin-top:25px">+506 8301-6664 &nbsp; · &nbsp; @thePark4You</p></section></main><footer class="footer"><div class="brand">THE PARK<span>4YOU</span></div><div>Northwest Costa Rica · Travel experiences</div><div><a href="https://wa.me/50683016664" target="_blank" rel="noopener">WhatsApp</a> &nbsp; · &nbsp; @thePark4You</div></footer><a class="wa" href="https://wa.me/50683016664" target="_blank" rel="noopener" aria-label="Contact us on WhatsApp">✆ &nbsp; WhatsApp</a><div id="modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-panel"><button class="close" id="close" aria-label="Close tour details">×</button><img id="modalImg" alt=""><div class="modal-content"><div class="eyebrow" id="modalCat"></div><h2 id="modalTitle"></h2><p id="modalDesc"></p><strong style="font-size:12px;letter-spacing:.13em;text-transform:uppercase">What's included</strong><ul id="modalIncludes"></ul><a id="modalBook" class="btn" href="#" target="_blank" rel="noopener">Ask about this tour ↗</a></div></div></div><script>const tours=[{name:'Palo Verde Boat Tour',cat:'nature',label:'Nature & Wildlife',desc:'Get close to Costa Rica’s incredible wildlife and enjoy excellent birdwatching and photography opportunities on a comfortable boat tour.',includes:['Typical lunch','Transportation','Tour guide','Entrance fees'],img:'photo-1472396961693-142e6e269027'},{name:'Tenorio & Miravalles Volcano',cat:'nature',label:'Waterfalls & Wellness',desc:'Three experiences in one day: discover waterfalls and sloths, enjoy a local meal, then unwind in thermal pools and volcanic mud baths.',includes:['Transportation','Tour guide','Waterfall entrance fees','Typical lunch','Hot springs','Hanging bridges','Mud baths'],img:'photo-1433086966358-54859d0ed716'},{name:'La Leona Waterfall & River Tubing',cat:'adventure',label:'Adventure',desc:'Hike scenic trails to La Leona Waterfall, swim and enjoy an exciting tubing experience on the Colorado River.',includes:['Transportation','Tour guide','Water','Entrance fees'],img:'photo-1500534623283-312aade485b7'},{name:'Rincón de la Vieja Mega Combo',cat:'adventure',label:'Full-day Adventure',desc:'An action-packed day of ziplining, horseback riding, waterslides, hot springs and volcanic landscapes.',includes:['Transportation','Tour guide','Lunch','Horseback riding','Ziplining','Water slide','Cultural experience','Hot springs','Mud baths'],img:'photo-1500534314209-a25ddb2bd429'},{name:'ATV or Side-by-Side Tour',cat:'adventure',label:'Off-road Adventure',desc:'Ride through tropical dry forest, mountain trails and rivers, with the chance to explore beautiful beaches.',includes:['Transportation','Tour guide','Water','2-hour tour'],img:'photo-1500534623283-312aade485b7'},{name:'Beach Hopping in Paradise',cat:'beach',label:'Coastal Escapes',desc:'Explore Las Catalinas, Playa Flamingo and Playa Conchal on a relaxed coastal journey filled with beautiful views.',includes:['Transportation','Tour guide'],img:'photo-1507525428034-b723cf961d3e'},{name:'Tenorio River Whitewater Rafting',cat:'adventure',label:'River Adventure',desc:'Experience the thrill of whitewater rafting on the Tenorio River, with rapids ranging from Class I to IV.',includes:['Transportation','Lunch','Tour guide','Entrance fees'],img:'photo-1472745942893-4b9f730c7668'},{name:'Nicaragua Day Tour',cat:'culture',label:'Culture & Discovery',desc:'Explore Granada, the Masaya volcano, artisan markets and the beautiful islets of Lake Nicaragua in one day.',includes:['Transportation','Border taxes in and out','Lunch','Masaya Volcano entrance','Lake Nicaragua boat tour','Granada wagon tour'],img:'photo-1482938289607-e9573fc25ebb'},{name:'Exclusive Private Waterfall',cat:'nature',label:'Private Experience',desc:'Visit the Rivas family farm and discover stunning waterfalls by hiking, side-by-side or helicopter.',includes:['Private farm entrance','River and waterfall hike','Transportation within the farm','Naturalist guides','Fresh fruit and water'],img:'photo-1433086966358-54859d0ed716'},{name:'Arenal Volcano & Hot Springs',cat:'nature',label:'Volcano & Wellness',desc:'Discover the breathtaking Arenal Volcano, lush rainforest and naturally heated hot springs around La Fortuna.',includes:['Typical lunch','Transportation','Tour guide','Entrance fees'],img:'photo-1464822759023-fed622ff2c3b'},{name:'Monteverde Cloud Forest',cat:'nature',label:'Nature & Wildlife',desc:'Explore Selvatura Park, hanging bridges and the incredible biodiversity of Monteverde’s lush cloud forest.',includes:['Typical lunch','Transportation','Tour guide','Hanging bridges','Entrance fees'],img:'photo-1448375240586-882707db888b'}];const cards=document.getElementById('cards'),modal=document.getElementById('modal');const imageUrl=id=>`https://images.unsplash.com/${id}?auto=format&fit=crop&w=1000&q=80`;function wa(t){return 'https://wa.me/50683016664?text='+encodeURIComponent('Hello The Park4You! I would like more information about the '+t+'.')}function render(cat='all'){cards.innerHTML='';tours.forEach((t,i)=>{if(cat!=='all'&&t.cat!==cat)return;const el=document.createElement('article');el.className='card';el.innerHTML=`<div class="photo"><img loading="lazy" src="${imageUrl(t.img)}" alt="Illustrative scenery for ${t.name}"><span class="tag">${t.label}</span></div><div class="card-body"><h3>${t.name}</h3><p>${t.desc}</p><div class="card-actions"><button class="textbtn" data-index="${i}">Discover experience ↗</button><a class="smallbtn" href="${wa(t.name)}" target="_blank" rel="noopener">Inquire ↗</a></div></div>`;cards.appendChild(el)});cards.querySelectorAll('[data-index]').forEach(b=>b.addEventListener('click',()=>openTour(tours[+b.dataset.index])))}function openTour(t){document.getElementById('modalImg').src=imageUrl(t.img);document.getElementById('modalImg').alt='Illustrative scenery for '+t.name;document.getElementById('modalCat').textContent=t.label;document.getElementById('modalTitle').textContent=t.name;document.getElementById('modalDesc').textContent=t.desc;document.getElementById('modalIncludes').innerHTML=t.includes.map(x=>'<li>'+x+'</li>').join('');document.getElementById('modalBook').href=wa(t.name);modal.classList.add('show');document.body.style.overflow='hidden';document.getElementById('close').focus()}function closeTour(){modal.classList.remove('show');document.body.style.overflow=''}document.querySelectorAll('.filter').forEach(b=>b.addEventListener('click',()=>{document.querySelector('.filter.active').classList.remove('active');b.classList.add('active');render(b.dataset.filter)}));document.getElementById('close').addEventListener('click',closeTour);modal.addEventListener('click',e=>{if(e.target===modal)closeTour()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeTour()});render();</script></body></html>
